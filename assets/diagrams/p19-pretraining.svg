<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="p19-title p19-desc">
  <title id="p19-title">预训练数据流水线与恢复训练的两条检查线</title>
  <desc id="p19-desc">十二条生成记录先规范化，删除一条空记录与一条精确重复，再按文档划分六条训练、两条验证、两条测试。中间显示春风和月装入同一块，但注意力与标签分别隔离，只有五个有效目标。底部说明恢复必须同时保存模型、优化器、随机数、数据游标和配置，并比较连续训练与中断恢复的完整状态。</desc>
  <defs>
    <marker id="p19-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.strong{font-weight:700}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#p19-arrow)}</style>
  </defs>
  <rect x="1" y="1" width="998" height="708" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="36" text-anchor="middle" class="title">预训练：先保证题目正确，再比较训练结果</text>
  <g text-anchor="middle">
    <rect x="25" y="60" width="270" height="125" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="160" y="89" class="label strong">生成语料：12 条记录</text>
    <text x="160" y="119" class="small">记录来源；不读取私有文件</text>
    <text x="160" y="148" class="small">NFC 规范化 → 删除空白</text>
    <text x="160" y="173" class="small">本例规则，不能照搬到代码语料</text>
    <path class="line" d="M295 124H328"/>
    <rect x="335" y="60" width="300" height="125" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="485" y="89" class="label strong">划分前做整篇精确去重</text>
    <text x="485" y="119" class="small">去掉 1 条空记录、1 条重复</text>
    <text x="485" y="148" class="small">保留 10 条唯一规范化文档</text>
    <text x="485" y="173" class="small">不等于近重复或语义污染检测</text>
    <path class="line" d="M635 124H668"/>
    <rect x="675" y="60" width="300" height="125" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="825" y="89" class="label strong">按完整文档划分</text>
    <text x="825" y="119" class="small">训练 6 ／ 验证 2 ／ 测试 2</text>
    <text x="825" y="148" class="small">只用训练集更新参数</text>
    <text x="825" y="173" class="small">默认不对最终测试集评分</text>
  </g>
  <rect x="25" y="204" width="950" height="271" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="48" y="237" class="label strong">Packing：装在同一行，仍是两篇独立文档</text>
  <text x="48" y="267" class="small">输入</text>
  <text x="48" y="318" class="small">目标</text>
  <g text-anchor="middle" class="label">
    <g fill="#dbeafe" stroke="#60a5fa"><rect x="130" y="246" width="86" height="36" rx="5"/><rect x="226" y="246" width="86" height="36" rx="5"/><rect x="322" y="246" width="86" height="36" rx="5"/><rect x="418" y="246" width="86" height="36" rx="5"/></g>
    <g fill="#ffedd5" stroke="#fb923c"><rect x="514" y="246" width="86" height="36" rx="5"/><rect x="610" y="246" width="86" height="36" rx="5"/><rect x="706" y="246" width="86" height="36" rx="5"/></g>
    <rect x="802" y="246" width="86" height="36" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="173" y="271">BOS</text><text x="269" y="271">春</text><text x="365" y="271">风</text><text x="461" y="271">EOS</text><text x="557" y="271">BOS</text><text x="653" y="271">月</text><text x="749" y="271">EOS</text><text x="845" y="271">PAD</text>
    <text x="173" y="319">春</text><text x="269" y="319">风</text><text x="365" y="319">EOS</text><text x="461" y="319">忽略</text><text x="557" y="319">月</text><text x="653" y="319">EOS</text><text x="749" y="319">忽略</text><text x="845" y="319">忽略</text>
    <path d="M130 338H504M514 338H792" stroke="#64748b" stroke-width="2"/>
    <text x="317" y="363" class="small">A：3 个有效目标</text><text x="653" y="363" class="small">B：2 个有效目标</text>
  </g>
  <text x="48" y="398" class="small">注意力边界：同一文档内只看当前和过去；B 不能读取 A。</text>
  <text x="48" y="427" class="small">标签边界：最后一个字预测 EOS；EOS 不预测下一篇的 BOS。</text>
  <text x="48" y="456" class="small">评分：有效 loss 总和 ÷ 5，而不是 ÷ 8，也不是两份文档均值再平均。</text>
  <g text-anchor="middle">
    <rect x="25" y="494" width="460" height="155" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="255" y="525" class="label strong">保存训练现场，而不只保存权重</text>
    <text x="255" y="557" class="small">模型 ＋ AdamW ＋ dropout / shuffle RNG</text>
    <text x="255" y="586" class="small">数据顺序和游标 ＋ 步数、tokens、配置</text>
    <text x="255" y="615" class="small">同数据版本；只在完整更新结束后保存</text>
    <path class="line" d="M485 571H523"/>
    <rect x="530" y="494" width="445" height="155" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="752" y="525" class="label strong">验证恢复：连续 12 步 vs 中断再继续</text>
    <text x="752" y="557" class="small">比较每步 loss 和完整最终状态</text>
    <text x="752" y="586" class="small">同环境 CPU 检查：逐项精确一致</text>
    <text x="752" y="615" class="small">不承诺不同版本、硬件或 GPU 逐位一致</text>
  </g>
  <text x="500" y="680" text-anchor="middle" class="small">本图是封闭生成语料实验；冻结的外部评估集应保留，重叠训练样本另行移除。</text>
</svg>
