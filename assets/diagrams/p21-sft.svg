<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="p21-title p21-desc">
  <title id="p21-title">对齐 assistant-only loss，再检查 LoRA 更新</title>
  <desc id="p21-desc">上图用问红回答红的八个 token 展示标签与因果错位。只有位置六的红和位置七的 EOS 是目标，由位置五和六的 logits 预测；其余标签忽略，分母为二。下图展示冻结基础矩阵 W0 的主路和可训练 A、B 的低秩支路，支路乘 alpha 除以 rank 后相加。普通浮点 LoRA 可合并为 W0 加 alpha 除以 rank 乘 BA。本章两个十六乘十六投影、rank 为二，共一百二十八个可训练参数；基础模型三千七百六十个参数仍然存在。</desc>
  <defs>
    <marker id="p21-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker>
    <marker id="p21-green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#15803d"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.head{font-size:20px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#p21-arrow)}.active{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#p21-green-arrow)}</style>
  </defs>
  <rect x="1" y="1" width="998" height="908" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="38" text-anchor="middle" class="title">SFT 决定评分位置；LoRA 决定更新参数</text>
  <rect x="22" y="58" width="956" height="345" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="42" y="90" class="head">① 输入全部可见的过去，只评分 assistant 正文与 EOS</text>
  <text x="42" y="116" class="small">labels 不提前移位；loss 内仅 shift 一次。ASST 表示 assistant 角色标记。</text>
  <g text-anchor="middle" class="small">
    <text x="61" y="150">位置</text>
    <text x="145" y="150">0</text><text x="255" y="150">1</text><text x="365" y="150">2</text><text x="475" y="150">3</text><text x="585" y="150">4</text><text x="695" y="150">5</text><text x="805" y="150">6</text><text x="915" y="150">7</text>
  </g>
  <g fill="#eff6ff" stroke="#93c5fd">
    <rect x="99" y="162" width="92" height="42" rx="6"/><rect x="209" y="162" width="92" height="42" rx="6"/><rect x="319" y="162" width="92" height="42" rx="6"/><rect x="429" y="162" width="92" height="42" rx="6"/><rect x="539" y="162" width="92" height="42" rx="6"/><rect x="649" y="162" width="92" height="42" rx="6"/><rect x="759" y="162" width="92" height="42" rx="6"/><rect x="869" y="162" width="92" height="42" rx="6"/>
  </g>
  <g text-anchor="middle" class="label">
    <text x="61" y="190" class="small">输入</text>
    <text x="145" y="190">BOS</text><text x="255" y="190">USER</text><text x="365" y="190">问</text><text x="475" y="190">红</text><text x="585" y="190">END</text><text x="695" y="190">ASST</text><text x="805" y="190">红</text><text x="915" y="190">EOS</text>
  </g>
  <g text-anchor="middle" class="small">
    <text x="61" y="233">logits</text>
    <text x="145" y="233">z0</text><text x="255" y="233">z1</text><text x="365" y="233">z2</text><text x="475" y="233">z3</text><text x="585" y="233">z4</text><text x="695" y="233" font-weight="700">z5</text><text x="805" y="233" font-weight="700">z6</text><text x="915" y="233">z7</text>
  </g>
  <path class="active" d="M695 240L794 273"/><path class="active" d="M805 240L904 273"/>
  <g fill="#f1f5f9" stroke="#cbd5e1">
    <rect x="99" y="277" width="92" height="40" rx="6"/><rect x="209" y="277" width="92" height="40" rx="6"/><rect x="319" y="277" width="92" height="40" rx="6"/><rect x="429" y="277" width="92" height="40" rx="6"/><rect x="539" y="277" width="92" height="40" rx="6"/><rect x="649" y="277" width="92" height="40" rx="6"/>
  </g>
  <g fill="#dcfce7" stroke="#4ade80">
    <rect x="759" y="277" width="92" height="40" rx="6"/><rect x="869" y="277" width="92" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" class="small">
    <text x="61" y="303">labels</text><text x="145" y="303">−100</text><text x="255" y="303">−100</text><text x="365" y="303">−100</text><text x="475" y="303">−100</text><text x="585" y="303">−100</text><text x="695" y="303">−100</text><text x="805" y="303" font-weight="700">13（红）</text><text x="915" y="303" font-weight="700">6（EOS）</text>
  </g>
  <text x="42" y="351" class="label" font-weight="700">N = 2，不是 8；loss = −(ln 0.5 + ln 0.25) / 2 ≈ 1.03972</text>
  <text x="42" y="380" class="small">不评分 user ≠ 看不见 user。输入表示仍可通过上下文收到梯度；PAD 另用 attention mask。</text>

  <rect x="22" y="420" width="956" height="372" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="42" y="452" class="head">② 普通 LoRA：基础权重固定，可训练支路相加</text>
  <text x="42" y="481" class="label">y = W0x + (α/r) B(Ax)；A：[r, d_in]，B：[d_out, r]</text>
  <circle cx="103" cy="607" r="29" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="103" y="614" text-anchor="middle" class="head">x</text>
  <path class="line" d="M132 607H164V546H226"/>
  <path class="line" d="M132 607H164V681H226"/>
  <rect x="230" y="512" width="419" height="70" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="439" y="540" text-anchor="middle" class="head">W0：冻结，不更新权重</text>
  <text x="439" y="565" text-anchor="middle" class="small">仍参与计算，不等于整条路径 no_grad</text>
  <path class="line" d="M649 546H849"/>
  <rect x="230" y="645" width="181" height="72" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="320" y="675" text-anchor="middle" class="head">A：d_in → r</text>
  <text x="320" y="700" text-anchor="middle" class="small">随机初始化，可训练</text>
  <path class="active" d="M411 681H445"/>
  <rect x="449" y="645" width="181" height="72" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="539" y="675" text-anchor="middle" class="head">B：r → d_out</text>
  <text x="539" y="700" text-anchor="middle" class="small">零初始化，可训练</text>
  <path class="active" d="M630 681H668"/>
  <rect x="672" y="645" width="106" height="72" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="725" y="689" text-anchor="middle" class="head">× α/r</text>
  <path class="active" d="M778 681H879V580"/>
  <circle cx="879" cy="546" r="29" fill="#fff7ed" stroke="#fb923c"/>
  <text x="879" y="554" text-anchor="middle" class="head">＋</text>
  <path class="line" d="M909 546H939"/>
  <text x="949" y="553" class="head">y</text>
  <text x="42" y="757" class="small">本章 q/v 各为 16 × 16，r = 2：2 × [2 × (16 + 16)] = 128 个可训练参数。</text>
  <rect x="22" y="809" width="956" height="79" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="500" y="840" text-anchor="middle" class="head">合并：W_merged = W0 + (α/r)BA → 新的普通线性层</text>
  <text x="500" y="869" text-anchor="middle" class="small">基础 3,760 参数仍存在；合并验证数值等价，不代表测过速度、QLoRA 或大模型质量。</text>
</svg>
