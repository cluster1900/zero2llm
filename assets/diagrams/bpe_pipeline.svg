<svg xmlns="http://www.w3.org/2000/svg" width="520" height="670" viewBox="0 0 520 670" role="img" aria-labelledby="title desc"><title id="title">BPE 训练与使用</title><desc id="desc">训练文档：分别转成字节；统计相邻对：选择并合并；保存词表与合并次序：训练到此结束；新文本编码：只应用已有规则；token ID 序列：模型使用的编号；拼回字节再解码：还原文本</desc><rect width="520" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="260" y="34" font-size="23" fill="#172554">BPE 训练与使用</text><rect x="35" y="55" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="84" font-size="21" fill="#172554">训练文档</text><text x="260" y="110" font-size="17" fill="#475569">分别转成字节</text><path d="M260 130 V149" stroke="#475569" stroke-width="2"/><path d="M254 143 L260 150 L266 143" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="155" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="184" font-size="21" fill="#172554">统计相邻对</text><text x="260" y="210" font-size="17" fill="#475569">选择并合并</text><path d="M260 230 V249" stroke="#475569" stroke-width="2"/><path d="M254 243 L260 250 L266 243" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="255" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="284" font-size="21" fill="#172554">保存词表与合并次序</text><text x="260" y="310" font-size="17" fill="#475569">训练到此结束</text><path d="M260 330 V349" stroke="#475569" stroke-width="2"/><path d="M254 343 L260 350 L266 343" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="355" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="384" font-size="21" fill="#172554">新文本编码</text><text x="260" y="410" font-size="17" fill="#475569">只应用已有规则</text><path d="M260 430 V449" stroke="#475569" stroke-width="2"/><path d="M254 443 L260 450 L266 443" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="455" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="484" font-