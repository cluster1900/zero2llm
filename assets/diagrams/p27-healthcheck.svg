<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">miniGPT 体检：阶段、证据与结论边界</title>
  <desc id="desc">S0 基线依次连接缓存、旋转位置、现代模块、分组查询、专家模型和可选多词预测。体检同时检查张量账本、数值不变量和三类真实坏实现；通过只说明当前小型 CPU 实验正确，不代表语言质量或 GPU 加速。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52677d"/></marker></defs>
  <rect width="1120" height="700" rx="18" fill="#f5f7fa"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#20354a">
    <text x="38" y="48" font-size="27" font-weight="700">给自己的 miniGPT 做体检</text>
    <text x="38" y="80" font-size="17">先证明改动正确，再讨论成本；不同架构不要求 logits 相同。</text>
    <g stroke="#52677d" stroke-width="2" marker-end="url(#arrow)">
      <path d="M174 153H190"/><path d="M328 153H344"/><path d="M482 153H498"/>
      <path d="M636 153H652"/><path d="M790 153H806"/><path d="M944 153H960"/>
    </g>
    <g text-anchor="middle">
      <rect x="36" y="108" width="138" height="94" rx="12" fill="#dceafa" stroke="#7aa6d0"/>
      <text x="105" y="138" font-size="21" font-weight="700">S0</text><text x="105" y="168" font-size="17">Baby-GPT 基线</text>
      <rect x="190" y="108" width="138" height="94" rx="12" fill="#dceafa" stroke="#7aa6d0"/>
      <text x="259" y="138" font-size="21" font-weight="700">S1</text><text x="259" y="168" font-size="17">KV 缓存</text>
      <rect x="344" y="108" width="138" height="94" rx="12" fill="#e5eef6" stroke="#91abc2"/>
      <text x="413" y="138" font-size="21" font-weight="700">S2</text><text x="413" y="168" font-size="17">RoPE 旋转位置</text>
      <rect x="498" y="108" width="138" height="94" rx="12" fill="#e5eef6" stroke="#91abc2"/>
      <text x="567" y="138" font-size="21" font-weight="700">S3</text><text x="567" y="168" font-size="17">归一化与 FFN</text>
      <rect x="652" y="108" width="138" height="94" rx="12" fill="#e5eef6" stroke="#91abc2"/>
      <text x="721" y="138" font-size="21" font-weight="700">S4</text><text x="721" y="168" font-size="17">GQA 分组 KV</text>
      <rect x="806" y="108" width="138" height="94" rx="12" fill="#e5eef6" stroke="#91abc2"/>
      <text x="875" y="138" font-size="21" font-weight="700">S5</text><text x="875" y="168" font-size="17">教学 MoE</text>
      <rect x="960" y="108" width="124" height="94" rx="12" fill="#eee8f7" stroke="#9b86bb" stroke-dasharray="6 4"/>
      <text x="1022" y="138" font-size="21" font-weight="700">S6 选修</text><text x="1022" y="168" font-size="17">MTP 旁路</text>
    </g>
    <text x="39" y="232" font-size="16" fill="#386389">S0 与 S1 是同一个模型对象；缓存只是换一种计算方式。</text>
    <text x="39" y="262" font-size="16" fill="#386389">S3 另设 A → B → C 消融：先只换归一化，再换 FFN 家族与匹配宽度。</text>
    <g>
      <rect x="36" y="291" width="330" height="225" rx="14" fill="#ffffff" stroke="#a8b8c8"/>
      <text x="58" y="328" font-size="22" font-weight="700">① 对账：这是什么模型？</text>
      <text x="58" y="365" font-size="17">配置、词表顺序、权重、dtype</text>
      <text x="58" y="400" font-size="17">严格加载；同形状不等于同语义</text>
      <text x="58" y="435" font-size="17">MHA 缓存 4096 字节</text>
      <text x="58" y="468" font-size="17">GQA 缓存 2048 字节</text>
      <text x="58" y="495" font-size="14" fill="#5d6b79">只算张量载荷，不是进程内存或显存。</text>
      <rect x="395" y="291" width="330" height="225" rx="14" fill="#ffffff" stroke="#a8b8c8"/>
      <text x="417" y="328" font-size="22" font-weight="700">② 验证：什么必须不变？</text>
      <text x="417" y="365" font-size="17">同权重：完整前向 ≈ 分块缓存</text>
      <text x="417" y="400" font-size="17">改未来 token：过去 logits 不变</text>
      <text x="417" y="435" font-size="17">保存再加载：权重与输出不变</text>
      <text x="417" y="468" font-size="17">标量手算、路由计数与有限梯度</text>
      <text x="417" y="495" font-size="14" fill="#5d6b79">缓存容差：atol=3e-6，rtol=1e-5。</text>
      <rect x="754" y="291" width="330" height="225" rx="14" fill="#fff4eb" stroke="#d5a477"/>
      <text x="776" y="328" font-size="22" font-weight="700">③ 反证：检查器能抓错吗？</text>
      <text x="776" y="365" font-size="17">坏掩码：误用矩形 tril</text>
      <text x="776" y="400" font-size="17">错位置：每块又从位置 0 开始</text>
      <text x="776" y="435" font-size="17">缓存污染：新请求接着旧历史算</text>
      <text x="776" y="468" font-size="17">错误输出仍有限，但数值不对</text>
      <text x="776" y="495" font-size="14" fill="#805b3d">抛依赖异常、没有运行，都不算抓住错误。</text>
    </g>
    <path d="M560 526V553" stroke="#52677d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="36" y="565" width="1048" height="98" rx="14" fill="#e0f0e9" stroke="#84b49b"/>
    <text x="58" y="601" font-size="21" font-weight="700">通过之后，写清模型卡与实验边界</text>
    <text x="58" y="633" font-size="17">CPU 小张量 + 随机权重 + 合成 token：不是语言能力评测，不是 GPU 性能，也不是生产模型复现。</text>
  </g>
</svg>
