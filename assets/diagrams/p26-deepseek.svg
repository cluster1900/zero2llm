<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title description">
  <title id="title">DeepSeek 跨版本证据地图</title>
  <desc id="description">V3 的 MLA、MoE、顺序 MTP；R1 的后训练教师和 Qwen 蒸馏学生；V4.1-Flash 的 CED、CSA2、SWA、DSpark。配置只能说明尺寸和开关，论文与源码说明流程，本书 CPU 实验只验证小规模算术与坐标。</desc>
  <defs>
    <style>text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #172b45; } .title { font-size:32px; font-weight:700; } .h { font-size:26px; font-weight:700; } .t { font-size:23px; } .s { font-size:21px; } .muted { fill:#4c6079; } .rule { stroke:#b9cadb; stroke-width:2; } </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#58758f"/></marker>
  </defs>
  <rect width="960" height="780" rx="22" fill="#f6f8fb"/>
  <text x="30" y="48" class="title">同一个品牌，三条不同的证据路线</text>
  <text x="30" y="86" class="t muted">P26 · 固定版本 → 组件与训练 → 小实验的结论边界</text>

  <rect x="28" y="116" width="284" height="370" rx="16" fill="#e9f2ff" stroke="#82acd9" stroke-width="2"/>
  <text x="48" y="158" class="h">V3：拆开三件事</text>
  <line x1="48" y1="178" x2="292" y2="178" class="rule"/>
  <text x="48" y="217" class="t">MLA：历史存什么</text>
  <text x="48" y="253" class="s muted">latent ＋ 独立位置键</text>
  <text x="48" y="303" class="t">MoE：执行谁</text>
  <text x="48" y="339" class="s muted">共享专家 ＋ 选中专家</text>
  <text x="48" y="389" class="t">MTP：多监督什么</text>
  <text x="48" y="425" class="s muted">顺序预测模块</text>
  <text x="48" y="462" class="s muted">回到 P14 / P18 / P23</text>

  <rect x="338" y="116" width="284" height="370" rx="16" fill="#ecf8f2" stroke="#81bca4" stroke-width="2"/>
  <text x="358" y="158" class="h">R1：训练与蒸馏</text>
  <line x1="358" y1="178" x2="602" y2="178" class="rule"/>
  <text x="358" y="217" class="t">教师：V3 形状主干</text>
  <text x="358" y="253" class="s muted">后训练步骤看论文</text>
  <path d="M 480 270 L 480 310" stroke="#58758f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="358" y="350" class="t">示范数据 → 学生 SFT</text>
  <text x="358" y="389" class="s muted">本章学生：Qwen 结构</text>
  <text x="358" y="425" class="s muted">不继承教师全部构件</text>
  <text x="358" y="462" class="s muted">回到 P21 / P22 / P23</text>

  <rect x="648" y="116" width="284" height="370" rx="16" fill="#fff3e5" stroke="#d8ad74" stroke-width="2"/>
  <text x="668" y="158" class="h">V4.1-Flash</text>
  <line x1="668" y1="178" x2="912" y2="178" class="rule"/>
  <text x="668" y="217" class="t">CED：全局 KV 来源</text>
  <text x="668" y="253" class="s muted">decoder 读 encoder</text>
  <text x="668" y="298" class="t">CSA2：共享与重选</text>
  <text x="668" y="334" class="s muted">SWA 仍是各层局部状态</text>
  <text x="668" y="379" class="t">DSpark：另训草稿</text>
  <text x="668" y="415" class="s muted">不等于 V3 预训练 MTP</text>
  <text x="668" y="462" class="s muted">图像入口、mHC、Engram</text>

  <path d="M 170 491 L 170 524" stroke="#58758f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 480 491 L 480 524" stroke="#58758f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 790 491 L 790 524" stroke="#58758f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="28" y="540" width="904" height="206" rx="16" fill="#fff" stroke="#b9cadb" stroke-width="2"/>
  <text x="48" y="580" class="h">三种证据，不互相冒充</text>
  <line x1="48" y1="598" x2="912" y2="598" class="rule"/>
  <text x="48" y="636" class="t">配置快照</text>
  <text x="48" y="672" class="s muted">字段、尺寸、开关</text>
  <text x="48" y="711" class="s muted">缺失字段保持 unknown</text>
  <line x1="330" y1="620" x2="330" y2="723" class="rule"/>
  <text x="358" y="636" class="t">版本化论文 / 源码</text>
  <text x="358" y="672" class="s muted">训练时序、数据来源</text>
  <text x="358" y="711" class="s muted">字段名 ≠ 训练事实</text>
  <line x1="640" y1="620" x2="640" y2="723" class="rule"/>
  <text x="668" y="636" class="t">本书 CPU 小实验</text>
  <text x="668" y="672" class="s muted">算术、账本、坐标</text>
  <text x="668" y="711" class="s muted">不是官方模型性能复现</text>
</svg>
