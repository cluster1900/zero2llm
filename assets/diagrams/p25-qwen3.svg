<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">两份 Qwen3 快照：形状、专家和预算分开读</title>
  <desc id="desc">上部比较固定的零点六B dense与三十B A三B MoE配置。中部展示显式每头宽度一百二十八，QK归一化后做旋转位置编码，注意力使用紧凑KV头缓存，再选择dense前馈或128选8专家。下部以五个实际计数的假想token展示思考三项、闭合一项、答案一项，共用六个输出名额。结论仅适用于两份指定快照，不代表整个Qwen3家族。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#475569"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "NotoSansCJKSC", sans-serif; fill:#17324d; }
      .title { font-size:29px; font-weight:700; }
      .label { font-size:23px; font-weight:600; }
      .body { font-size:21px; }
      .small { font-size:18px; }
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
      .arrow { fill:none; stroke:#475569; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1060" rx="20" fill="white"/>
  <text x="600" y="45" text-anchor="middle" class="title">Qwen3 案例：先锁版本，再读配置，再做小实验</text>
  <text x="600" y="80" text-anchor="middle" class="body">核对日期 2026-10-19 · 不是整个家族的统一架构表</text>

  <rect x="35" y="105" width="550" height="203" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="615" y="105" width="550" height="203" rx="14" fill="#f0fdf4" stroke="#86c7a5" stroke-width="2"/>
  <text x="60" y="145" class="label">Qwen3-0.6B · dense</text>
  <text x="60" y="184" class="body">28 层 · D=1024 · Hq/Hkv=16/8</text>
  <text x="60" y="221" class="body">FFN 宽度 3072 · 输入／输出权重绑定</text>
  <text x="60" y="258" class="body">唯一架构参数：596,049,920</text>
  <text x="60" y="290" class="small">revision c1899de… · 正文给出完整提交</text>
  <text x="640" y="145" class="label">Qwen3-30B-A3B · MoE</text>
  <text x="640" y="184" class="body">48 层 · D=2048 · Hq/Hkv=32/4</text>
  <text x="640" y="221" class="body">128 选 8 专家 · 每专家宽度 768</text>
  <text x="640" y="258" class="body">唯一架构参数：30,532,122,624</text>
  <text x="640" y="290" class="small">revision ad44e77… · 正文给出完整提交</text>

  <rect x="35" y="330" width="1130" height="390" rx="14" class="panel"/>
  <text x="65" y="372" class="label">共同注意力路径：每头 d=128，Q 总宽度不等于 D</text>
  <rect x="65" y="405" width="200" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="165" y="439" text-anchor="middle" class="label">输入 [B,T,D]</text>
  <text x="165" y="471" text-anchor="middle" class="body">先做 RMSNorm</text>
  <path d="M265 447H305" class="arrow"/>
  <rect x="310" y="405" width="245" height="85" rx="10" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <text x="432" y="439" text-anchor="middle" class="label">Q/K 投影后归一化</text>
  <text x="432" y="471" text-anchor="middle" class="body">再做 split-half RoPE</text>
  <path d="M555 447H595" class="arrow"/>
  <rect x="600" y="405" width="245" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="722" y="439" text-anchor="middle" class="label">因果 GQA</text>
  <text x="722" y="471" text-anchor="middle" class="body">连续的 Q 头共用 KV</text>
  <path d="M845 447H885" class="arrow"/>
  <rect x="890" y="405" width="245" height="85" rx="10" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <text x="1012" y="439" text-anchor="middle" class="label">O 投影回 D</text>
  <text x="1012" y="471" text-anchor="middle" class="body">再加残差</text>
  <text x="65" y="528" class="body">Q/K gain 各有 d 个参数，跨头共享；V 不归一化、不旋转。</text>
  <text x="65" y="566" class="body">缓存保存 [B,Hkv,T,d] 的 K 与 V：只旋转新 K，不重复旋转历史。</text>
  <path d="M1012 490V584H600" fill="none" stroke="#475569" stroke-width="2.5"/>
  <path d="M600 584H320V602" class="arrow"/>
  <path d="M600 584H880V602" class="arrow"/>
  <rect x="65" y="605" width="510" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="625" y="605" width="510" height="80" rx="10" fill="#f0fdf4" stroke="#86c7a5" stroke-width="2"/>
  <text x="320" y="637" text-anchor="middle" class="label">归一化 → dense SwiGLU → 残差</text>
  <text x="320" y="669" text-anchor="middle" class="small">三矩阵：gate / up / down</text>
  <text x="880" y="637" text-anchor="middle" class="label">归一化 → 128 选 8 专家 → 残差</text>
  <text x="880" y="669" text-anchor="middle" class="small">选中权重再归一化；本快照无 shared expert</text>

  <rect x="35" y="745" width="1130" height="270" rx="14" class="panel"/>
  <text x="65" y="788" class="label">输出预算：思考、闭合、答案共用名额，不是各拿一份</text>
  <text x="65" y="826" class="body">假想输出 5 个 ID；max_new_tokens=6；不是预训练模型实测结果</text>
  <rect x="65" y="850" width="365" height="70" rx="10" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <rect x="445" y="850" width="205" height="70" rx="10" fill="#fff8e5" stroke="#d7a22c" stroke-width="2"/>
  <rect x="665" y="850" width="225" height="70" rx="10" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <rect x="905" y="850" width="225" height="70" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="247" y="878" text-anchor="middle" class="body">151667, 7, 8</text>
  <text x="247" y="907" text-anchor="middle" class="small">思考 3 项，含开头标签</text>
  <text x="547" y="878" text-anchor="middle" class="body">151668</text>
  <text x="547" y="907" text-anchor="middle" class="small">闭合 1 项</text>
  <text x="777" y="878" text-anchor="middle" class="body">9</text>
  <text x="777" y="907" text-anchor="middle" class="small">答案 1 项</text>
  <text x="1017" y="891" text-anchor="middle" class="label">剩余 1 名额</text>
  <text x="65" y="960" class="body">额度在闭合前用完：报告“答案段 0”，不能拿思考末尾冒充答案。</text>
  <text x="65" y="993" class="small">模板 False 的空 thinking 块属于 prompt；字符数不等于 token 数。</text>
  <text x="600" y="1045" text-anchor="middle" class="small">本章只运行随机微型 CPU 探针；不下载权重，不报告真实 Qwen 推理质量或速度。</text>
</svg>
