<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">RoPE rotation and cache positions</title>
<desc id="desc">A ninety-degree rotation maps vector three four to minus four three and preserves length five. A cache with three old keys appends only new keys rotated at positions three and four.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#425466"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker></defs>
<rect width="960" height="340" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#172b4d">
<text x="25" y="32" font-size="20" font-weight="bold">1. Rotate each pair, preserve its length</text>
<line x1="30" y1="221" x2="320" y2="221" stroke="#94a3b8" marker-end="url(#arrow)"/>
<line x1="170" y1="282" x2="170" y2="64" stroke="#94a3b8" marker-end="url(#arrow)"/>
<circle cx="170" cy="221" r="120" fill="none" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<line x1="170" y1="221" x2="242" y2="125" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
<line x1="170" y1="221" x2="74" y2="149" stroke="#d97706" stroke-width="4" marker-end="url(#orange)"/>
<text x="242" y="110" fill="#1d4ed8">(3, 4)</text><text x="27" y="131" fill="#b45309">(-4, 3)</text>
<path d="M212,165 A70,70 0 0,0 114,179" fill="none" stroke="#425466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="146" y="145">90°</text><text x="315" y="243">x</text><text x="183" y="71">y</text>
<rect x="45" y="292" width="265" height="33" rx="8" fill="#e2e8f0"/>
<text x="68" y="314">norm = 5 before and after</text>
<line x1="382" y1="48" x2="382" y2="315" stroke="#cbd5e1"/>
<text x="410" y="32" font-size="20" font-weight="bold">2. Continue positions when appending</text>
<text x="414" y="79">Old rotated K: keep unchanged</text>
<g fill="#dbeafe" stroke="#60a5fa"><rect x="414" y="94" width="82" height="55" rx="8"/><rect x="505" y="94" width="82" height="55" rx="8"/><rect x="596" y="94" width="82" height="55" rx="8"/></g>
<text x="442" y="127">K₀</text><text x="533" y="127">K₁</text><text x="624" y="127">K₂</text>
<g fill="#ffedd5" stroke="#fbbf24"><rect x="713" y="94" width="82" height="55" rx="8"/><rect x="804" y="94" width="82" height="55" rx="8"/></g>
<text x="741" y="127">K₃</text><text x="832" y="127">K₄</text>
<text x="694" y="129" font-size="24">+</text>
<path d="M755,199 L755,158" stroke="#425466" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M845,199 L845,158" stroke="#425466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="223">P = 3 cached tokens, C = 2 new tokens</text>
<text x="410" y="253">Rotate NEW Q/K at positions [3, 4]</text>
<text x="410" y="283" fill="#b45309">Not [0, 1]. Do not rotate old K again.</text>
<text x="410" y="313">V is not rotated in this implementation.</text>
</g></svg>
