<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1050" viewBox="0 0 1120 1050" role="img" aria-labelledby="title desc">
  <title id="title">量化缩小数值，服务还要跨过格式、内核与协议三道关</title>
  <desc id="desc">上部展示浮点值零点三七五除以零点二五、偶数舍入为二、恢复为零点五。中部区分权重、激活、KV三种量化对象，强调各自尺度与格式。下部展示本地微型模型从F32 GGUF经llama.cpp量化成Q8_0并提供loopback服务；SSE字节块须先组装事件，不等于token。仅测试执行路径，不声称模型质量或GPU加速。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "NotoSansCJKSC", sans-serif; fill: #183047; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="1050" rx="20" fill="#fff"/>
  <text x="560" y="44" class="title" text-anchor="middle">装得下 ≠ 算得快 ≠ 质量不变</text>
  <text x="560" y="78" class="body" text-anchor="middle">先确定数值规则，再检查模型格式、设备内核与流式边界</text>

  <rect x="35" y="103" width="1050" height="270" rx="15" class="panel"/>
  <text x="65" y="143" class="label">① 短尺子：scale 决定格距，zero-point 决定零点</text>
  <rect x="70" y="177" width="230" height="75" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="185" y="208" text-anchor="middle" class="label">浮点 x=0.375</text>
  <text x="185" y="237" text-anchor="middle" class="body">除以 s=0.25 → 1.5</text>
  <path d="M300 215H365" class="arrow"/>
  <rect x="370" y="177" width="365" height="75" rx="11" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <text x="552" y="208" text-anchor="middle" class="label">偶数舍入＋z=0 → q=2</text>
  <text x="552" y="237" text-anchor="middle" class="body">饱和到 [-127,127]，不绕回</text>
  <path d="M735 215H800" class="arrow"/>
  <rect x="805" y="177" width="240" height="75" rx="11" fill="#fff8e5" stroke="#d7a22c" stroke-width="2"/>
  <text x="925" y="208" text-anchor="middle" class="label">恢复值=0.5</text>
  <text x="925" y="237" text-anchor="middle" class="body">不是恢复原始小数</text>
  <path d="M135 298H1015" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2"><path d="M150 289V307M350 289V307M550 289V307M750 289V307M950 289V307"/></g>
  <g class="small" text-anchor="middle"><text x="150" y="333">−0.50</text><text x="350" y="333">−0.25</text><text x="550" y="333">0</text><text x="750" y="333">0.25</text><text x="950" y="333">0.50</text></g>
  <circle cx="850" cy="298" r="7" fill="#0284c7"/>
  <path d="M862 280Q908 264 945 284" class="arrow"/>
  <text x="560" y="358" text-anchor="middle" class="small">非截断范围：理想最近舍入误差 ≤ s/2；异常值被截断时不享受此界</text>

  <rect x="35" y="393" width="1050" height="250" rx="15" class="panel"/>
  <text x="65" y="432" class="label">② 三类对象独立配置：W8A8 不说明 KV 的格式</text>
  <rect x="70" y="455" width="300" height="140" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="410" y="455" width="300" height="140" rx="12" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <rect x="750" y="455" width="300" height="140" rx="12" fill="#fff8e5" stroke="#d7a22c" stroke-width="2"/>
  <text x="220" y="492" text-anchor="middle" class="label">权重 W</text>
  <text x="220" y="527" text-anchor="middle" class="body">长期保存；按行／组定尺度</text>
  <text x="220" y="562" text-anchor="middle" class="body">组越小 → scale 也越多</text>
  <text x="560" y="492" text-anchor="middle" class="label">激活 X</text>
  <text x="560" y="527" text-anchor="middle" class="body">随请求变化；静态／动态</text>
  <text x="560" y="562" text-anchor="middle" class="body">校准数据要有代表性</text>
  <text x="900" y="492" text-anchor="middle" class="label">KV cache</text>
  <text x="900" y="527" text-anchor="middle" class="body">随 token 追加；K 与 V</text>
  <text x="900" y="562" text-anchor="middle" class="body">影响分数与加权内容</text>
  <text x="560" y="624" text-anchor="middle" class="small">INT8、FP8、NF4 不是同一种格点；存储精度也不等于乘法或累加器精度</text>

  <rect x="35" y="663" width="1050" height="330" rx="15" class="panel"/>
  <text x="65" y="702" class="label">③ 实际 CPU 路线：未训练微型模型，只验证执行路径</text>
  <rect x="70" y="730" width="275" height="76" rx="11" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <text x="207" y="762" text-anchor="middle" class="label">F32 GGUF</text>
  <text x="207" y="792" text-anchor="middle" class="body">81,760 字节</text>
  <path d="M345 769H407" class="arrow"/>
  <rect x="412" y="730" width="275" height="76" rx="11" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <text x="550" y="762" text-anchor="middle" class="label">llama.cpp Q8_0</text>
  <text x="550" y="792" text-anchor="middle" class="body">27,392 字节</text>
  <path d="M687 769H749" class="arrow"/>
  <rect x="754" y="730" width="290" height="76" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="899" y="762" text-anchor="middle" class="label">本机 completion API</text>
  <text x="899" y="792" text-anchor="middle" class="body">127.0.0.1；只生成 4 token</text>
  <text x="65" y="848" class="body">文件门＋架构门＋内核门＋tokenizer／模板门：每一道都要检查</text>
  <rect x="70" y="870" width="975" height="62" rx="10" fill="#fff8e5" stroke="#d7a22c" stroke-width="1.5"/>
  <text x="558" y="910" text-anchor="middle" class="label">网络字节块 → 增量 UTF-8 → 完整 SSE 事件 → 文本与终止原因</text>
  <text x="560" y="970" text-anchor="middle" class="body">一个事件 ≠ 一个 token；断流 ≠ 正常完成；length ≠ 自然结束</text>
  <text x="560" y="1026" text-anchor="middle" class="small">b5046 小模型实测不证明 Qwen3／V4.1 兼容，也不证明质量无损或 GPU 加速</text>
</svg>
