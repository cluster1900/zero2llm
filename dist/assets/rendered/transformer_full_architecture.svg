<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <marker id="arr7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrCross" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="780" rx="16" fill="url(#bgGrad7)"/>

  <!-- Title -->
  <text x="450" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">图 7-2：经典 Transformer 完整宏观架构（编码器 - 解码器）</text>
  <text x="450" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">左侧编码器（理解原文）：双向无死角视界；右侧解码器（生成译文）：因果掩码 + 交叉注意力交互</text>

  <!-- Left Column: ENCODER -->
  <!-- Encoder Border Frame -->
  <rect x="70" y="100" width="340" height="560" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">编码器 (Encoder) × N 层</text>

  <!-- Encoder Input Embedding -->
  <rect x="110" y="600" width="260" height="35" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="240" y="622" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">输入词嵌入 (Input Embedding)</text>

  <!-- Encoder Positional Encoding -->
  <circle cx="240" cy="560" r="16" fill="#3b82f6"/>
  <text x="240" y="565" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="320" y="565" font-family="sans-serif" font-size="12" fill="#93c5fd">正弦位置编码 PE</text>
  <line x1="240" y1="600" x2="240" y2="576" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Encoder Multi-Head Attention -->
  <rect x="110" y="440" width="260" height="50" rx="8" fill="url(#encGrad)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="240" y="465" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">多头自注意力 (双向无遮挡)</text>
  <text x="240" y="480" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">全文词汇全员互相打招呼</text>
  <line x1="240" y1="544" x2="240" y2="490" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Encoder Add & Norm 1 -->
  <rect x="140" y="380" width="200" height="30" rx="6" fill="#0284c7"/>
  <text x="240" y="400" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">残差连接 + 层归一化</text>
  <line x1="240" y1="440" x2="240" y2="410" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Encoder FFN -->
  <rect x="110" y="270" width="260" height="50" rx="8" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">前馈神经网络 (FFN)</text>
  <text x="240" y="310" font-family="sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">每个词独立深思消化</text>
  <line x1="240" y1="380" x2="240" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Encoder Add & Norm 2 -->
  <rect x="140" y="210" width="200" height="30" rx="6" fill="#0284c7"/>
  <text x="240" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">残差连接 + 层归一化</text>
  <line x1="240" y1="270" x2="240" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Encoder Output arrow leading out and crossing over -->
  <line x1="240" y1="210" x2="240" y2="160" stroke="#94a3b8" stroke-width="2"/>


  <!-- Right Column: DECODER -->
  <!-- Decoder Border Frame -->
  <rect x="490" y="100" width="340" height="560" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="660" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">解码器 (Decoder) × N 层</text>

  <!-- Decoder Input Embedding -->
  <rect x="530" y="600" width="260" height="35" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="660" y="622" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">输出词嵌入 (已生成的文字)</text>

  <!-- Decoder Positional Encoding -->
  <circle cx="660" cy="560" r="16" fill="#a855f7"/>
  <text x="660" y="565" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <line x1="660" y1="600" x2="660" y2="576" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Decoder Masked MHA -->
  <rect x="530" y="470" width="260" height="50" rx="8" fill="url(#decGrad)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="660" y="493" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">带因果掩码自注意力 (Masked MHA)</text>
  <text x="660" y="510" font-family="sans-serif" font-size="11" fill="#f3e8ff" text-anchor="middle">严禁偷看未来还没有生成的词</text>
  <line x1="660" y1="544" x2="660" y2="520" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Decoder Cross Attention (The Bridge) -->
  <rect x="530" y="340" width="260" height="55" rx="8" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  <text x="660" y="363" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">交叉注意力 (Cross-Attention)</text>
  <text x="660" y="380" font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">Q 来自解码器，K、V 来自编码器</text>
  <line x1="660" y1="470" x2="660" y2="395" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Cross-Attention bridge from Encoder -->
  <path d="M 240 160 L 460 160 L 460 365 L 530 365" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrCross)"/>
  <text x="410" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">传递 K, V</text>

  <!-- Decoder FFN -->
  <rect x="530" y="220" width="260" height="45" rx="8" fill="#7e22ce" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="660" y="247" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">前馈神经网络 (FFN)</text>
  <line x1="660" y1="340" x2="660" y2="265" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr7)"/>

  <!-- Top Classification Head -->
  <line x1="660" y1="220" x2="660" y2="90" stroke="#94a3b8" stroke-width="2"/>

  <rect x="560" y="65" width="200" height="30" rx="6" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
  <text x="660" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">线性层 + Softmax 预测概率</text>

  <!-- Output text label -->
  <text x="660" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">输出下一个词 (Next Token)</text>
  <line x1="660" y1="65" x2="660" y2="35" stroke="#34d399" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- Bottom Labels -->
  <text x="240" y="670" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">输入句子 (例如: "床前明月光")</text>
  <text x="660" y="670" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">前缀提示 (例如: "&lt;BOS&gt; 疑是地上")</text>
</svg>
