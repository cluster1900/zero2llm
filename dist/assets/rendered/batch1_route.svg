<svg xmlns="http://www.w3.org/2000/svg" width="520" height="524" viewBox="0 0 520 524" role="img" aria-labelledby="title desc"><title id="title">全书阅读路线</title><desc id="desc">基础篇 P00–P10 为主线，按顺序读：词嵌入、Tokenizer、注意力、位置编码、残差与 FFN、生成、训练、Baby-GPT；之后按兴趣挑读架构与推理篇 P11–P18、训练与应用篇 P19–P24、案例与更新篇 P25–P28</desc><rect width="520" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="260" y="34" font-size="23" fill="#172554">全书阅读路线</text><rect x="35" y="52" width="450" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="260" y="81" font-size="20" fill="#172554">基础篇 P00–P10（主线，按顺序读）</text><text x="260" y="106" font-size="15" fill="#475569">词嵌入 → Tokenizer → 注意力 → 位置编码</text><text x="260" y="128" font-size="15" fill="#475569">→ 残差与 FFN → 生成 → 训练 → Baby-GPT</text><path d="M260 174 V196" stroke="#475569" stroke-width="2"/><path d="M254 190 L260 197 L266 190" fill="none" stroke="#475569" stroke-width="2"/><text x="260" y="218" font-size="15" fill="#475569">之后按兴趣挑读</text><rect x="35" y="232" width="450" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="261" font-size="20" fill="#172554">架构与推理篇 P11–P18</text><text x="260" y="286" font-size="15" fill="#475569">KV cache、RoPE、现代 Block、注意力系统、MoE</text><rect x="35" y="328" width="450" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="357" font-size="20" fill="#172554">训练与应用篇 P19–P24</text><text x="260" y="382" font-size="15" fill="#475569">预训练、框架、SFT/LoRA、偏好优化、MTP、量化</text><rect x="35" y="424" width="450" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="453" font-size="20" fill="#172554">案例与更新篇 P25–P28</text><text x="260" y="478" font-size="15" fill="#475569">Qwen3、DeepSeek 案例，miniGPT 体检，附录</text></g></svg>
