<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" viewBox="0 0 324 412" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" width="324" height="412"><title id="chart-title-my-svg">长度要分三本账：能算、不越界、质量保持互不蕴含</title><desc id="chart-desc-my-svg">训练最长 T_train=8、测试 T=12 时，正弦公式能给出 [12,D] 且前 8 行不变；实现仍可能因位置表、mask 或缓存越界；任务质量还要另测 loss。三本账彼此独立，图中上下排列只为控制宽高比。</desc><style>#my-svg{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#172554;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#fff7ed;}#my-svg .error-text{fill:#000812;stroke:#000812;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#475569;stroke:#475569;}#my-svg .marker.cross{stroke:#475569;}#my-svg svg{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;}#my-svg p{margin:0;}#my-svg .label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#172554;}#my-svg .cluster-label text{fill:#000812;}#my-svg .cluster-label span{color:#000812;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#172554;color:#172554;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#eff6ff;stroke:#3b82f6;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#475569!important;stroke-width:0;stroke:#475569;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePaths .path{stroke:#475569;stroke-width:1px;}#my-svg .flowchart-link{stroke:#475569;fill:none;}#my-svg .edgeLabel{background-color:#ecfdf5;text-align:center;}#my-svg .edgeLabel p{background-color:#ecfdf5;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#ecfdf5;fill:#ecfdf5;}#my-svg .labelBkg{background-color:rgba(236, 253, 245, 0.5);}#my-svg .cluster rect{fill:#fff7ed;stroke:hsl(33.3333333333, 60%, 86.4705882353%);stroke-width:1px;}#my-svg .cluster text{fill:#000812;}#my-svg .cluster span{color:#000812;}#my-svg .node .collapsed-indicator{fill:hsl(33.3333333333, 60%, 86.4705882353%);stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:hsl(33.3333333333, 60%, 86.4705882353%);stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:12px;background:#fff7ed;border:1px solid hsl(33.3333333333, 60%, 86.4705882353%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172554;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#ecfdf5;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#ecfdf5;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#ecfdf5;fill:#ecfdf5;}#my-svg .label-icon