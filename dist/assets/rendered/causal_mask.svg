<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="480" rx="16" fill="url(#bgGrad6)"/>

  <!-- Title -->
  <text x="410" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">图 7-1：因果掩码矩阵（Causal Mask / 下三角掩码）原理</text>
  <text x="410" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">闭卷考试机制：生成当前字时，严禁偷看未来尚未生成的字（填充 -∞ 强制注意力权重为 0%）</text>

  <!-- Matrix Grid -->
  <g transform="translate(140, 110)">
    <!-- Column Headers (Key 目标) -->
    <text x="75" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">目标: 词1(我)</text>
    <text x="175" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">目标: 词2(爱)</text>
    <text x="275" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">目标: 词3(学)</text>
    <text x="375" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">目标: 词4(习)</text>

    <!-- Row 1: Query 1 (我) -->
    <text x="-20" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="end">查询: 词1(我)</text>
    <!-- Cell (1,1): allowed -->
    <rect x="30" y="10" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <!-- Cell (1,2): masked -->
    <rect x="130" y="10" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="175" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>
    <!-- Cell (1,3): masked -->
    <rect x="230" y="10" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="275" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>
    <!-- Cell (1,4): masked -->
    <rect x="330" y="10" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="375" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>

    <!-- Row 2: Query 2 (爱) -->
    <text x="-20" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="end">查询: 词2(爱)</text>
    <rect x="30" y="90" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="130" y="90" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="175" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="230" y="90" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="275" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>
    <rect x="330" y="90" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="375" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>

    <!-- Row 3: Query 3 (学) -->
    <text x="-20" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="end">查询: 词3(学)</text>
    <rect x="30" y="170" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="130" y="170" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="175" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="230" y="170" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="275" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="330" y="170" width="90" height="60" rx="6" fill="#3f1424" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="375" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">-∞</text>

    <!-- Row 4: Query 4 (习) -->
    <text x="-20" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="end">查询: 词4(习)</text>
    <rect x="30" y="250" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="130" y="250" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="175" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="230" y="250" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="275" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
    <rect x="330" y="250" width="90" height="60" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="375" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">保留分数</text>
  </g>

  <!-- Right side Explanatory Panel -->
  <g transform="translate(580, 120)">
    <rect width="210" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">💡 数学实现魔法：</text>
    <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#cbd5e1">1. 绿色下三角区：</text>
    <text x="35" y="80" font-family="sans-serif" font-size="11" fill="#94a3b8">过去和现在的词，正常</text>
    <text x="35" y="98" font-family="sans-serif" font-size="11" fill="#94a3b8">计算点积注意力。</text>

    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#fca5a5">2. 红色右上三角区：</text>
    <text x="35" y="150" font-family="sans-serif" font-size="11" fill="#94a3b8">未来的词，分数直接</text>
    <text x="35" y="168" font-family="sans-serif" font-size="11" fill="#94a3b8">强制填入 -10 亿 (-∞)。</text>

    <text x="20" y="200" font-family="sans-serif" font-size="12" fill="#fde047">3. 经过 Softmax 后：</text>
    <text x="35" y="220" font-family="sans-serif" font-size="11" fill="#cbd5e1">根据指数函数的性质：</text>
    <text x="35" y="240" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">e^(-∞) = 0</text>
    <text x="35" y="260" font-family="sans-serif" font-size="11" fill="#6ee7b7">未来权重精准归零！</text>
  </g>
</svg>
