<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
  <title id="title">S5 教学 MoE：路由专家与共享专家</title>
  <desc id="desc">S4 的 FFN 被替换为 MoE。输入进入路由器选择四个专家中的两个，再按原 affinity 的归一化权重组合。共享专家始终执行并相加。容量丢弃只用于独立实验，语言模型保持不丢弃以保证缓存分块等价。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "NotoSansCJKSC", sans-serif; fill: #183047; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 600; }
      .small { font-size: 18px; }
      .tiny { font-size: 17px; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .selected { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .idle { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="830" rx="20" fill="#ffffff"/>
  <text x="500" y="43" text-anchor="middle" class="title">S5 只替换 FFN：每个 token 选择部分专家</text>
  <text x="500" y="77" text-anchor="middle" class="small">保留 S4 的 RoPE、RMSNorm、GQA、残差和 compact KV cache</text>
  <rect x="340" y="105" width="320" height="65" rx="12" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <text x="500" y="133" text-anchor="middle" class="label">归一化后的输入 x</text>
  <text x="500" y="158" text-anchor="middle" class="small">[B,T,D] → [N,D]</text>
  <path d="M440 170V204H335V230" class="line"/>
  <path d="M600 170V190H980V403H850V434" class="line"/>
  <rect x="105" y="230" width="460" height="104" rx="12" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <text x="335" y="261" text-anchor="middle" class="label">router：z = x W_r^T</text>
  <text x="335" y="290" text-anchor="middle" class="small">Softmax affinity → top-k</text>
  <text x="335" y="316" text-anchor="middle" class="tiny">本例 E=4、k=2；平局按专家编号</text>
  <rect x="655" y="241" width="300" height="109" rx="12" fill="#fff8e5" stroke="#d7a22c" stroke-width="1.5"/>
  <text x="805" y="271" text-anchor="middle" class="label">可选均衡偏置</text>
  <text x="805" y="299" text-anchor="middle" class="small">只改变选择 p + b</text>
  <text x="805" y="326" text-anchor="middle" class="small">不进入组合权重</text>
  <path d="M655 280H565" class="line"/>
  <path d="M335 334V371H145V434" class="line"/>
  <path d="M335 371H335V434" class="line"/>
  <text x="353" y="399" class="small">dispatch：按专家收集 token</text>
  <rect x="65" y="434" width="160" height="90" rx="12" class="selected"/>
  <rect x="255" y="434" width="160" height="90" rx="12" class="selected"/>
  <rect x="445" y="434" width="120" height="90" rx="12" class="idle"/>
  <rect x="590" y="434" width="120" height="90" rx="12" class="idle"/>
  <rect x="755" y="434" width="190" height="90" rx="12" fill="#eaf7f0" stroke="#22a06b" stroke-width="2"/>
  <text x="145" y="469" text-anchor="middle" class="label">专家 0</text>
  <text x="145" y="499" text-anchor="middle" class="small">权重 4/7</text>
  <text x="335" y="469" text-anchor="middle" class="label">专家 1</text>
  <text x="335" y="499" text-anchor="middle" class="small">权重 3/7</text>
  <text x="505" y="469" text-anchor="middle" class="label">专家 2</text>
  <text x="505" y="499" text-anchor="middle" class="small">不执行</text>
  <text x="650" y="469" text-anchor="middle" class="label">专家 3</text>
  <text x="650" y="499" text-anchor="middle" class="small">不执行</text>
  <text x="850" y="469" text-anchor="middle" class="label">共享专家</text>
  <text x="850" y="499" text-anchor="middle" class="small">每 token 都执行</text>
  <path d="M145 524V568H420V601" class="line"/>
  <path d="M335 524V551H460V601" class="line"/>
  <path d="M850 524V568H620V601" class="line"/>
  <rect x="295" y="601" width="410" height="91" rx="12" fill="#edf2ff" stroke="#6477bf" stroke-width="2"/>
  <text x="500" y="632" text-anchor="middle" class="label">按 token 原位置加权合回，再相加</text>
  <text x="500" y="661" text-anchor="middle" class="small">路由分支 + 全部共享分支</text>
  <text x="500" y="684" text-anchor="middle" class="tiny">外层 Block 再加残差，MoE 不重复加</text>
  <rect x="55" y="721" width="890" height="82" rx="12" fill="#fff8e5" stroke="#d7a22c" stroke-width="1.5"/>
  <text x="500" y="752" text-anchor="middle" class="small">独立容量实验：先到先收，超额分支为 0，不重新归一化</text>
  <text x="500" y="783" text-anchor="middle" class="small">S5 语言模型不丢弃；每次调用重置配额会破坏分块 / cache 等价</text>
</svg>
