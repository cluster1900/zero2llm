<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" role="img" aria-labelledby="title desc"><title id="title">从 token ID 查到 embedding</title><desc id="desc">token ID = 2：只是编号，不是语义大小；嵌入表 E：V 行 × D 列；取第 2 行：例：[-0.5, 0.8]；后续网络：结合上下文更新表示</desc><rect width="520" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="260" y="34" font-size="23" fill="#172554">从 token ID 查到 embedding</text><rect x="35" y="55" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="84" font-size="21" fill="#172554">token ID = 2</text><text x="260" y="110" font-size="17" fill="#475569">只是编号，不是语义大小</text><path d="M260 130 V149" stroke="#475569" stroke-width="2"/><path d="M254 143 L260 150 L266 143" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="155" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="184" font-size="21" fill="#172554">嵌入表 E</text><text x="260" y="210" font-size="17" fill="#475569">V 行 × D 列</text><path d="M260 230 V249" stroke="#475569" stroke-width="2"/><path d="M254 243 L260 250 L266 243" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="255" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="284" font-size="21" fill="#172554">取第 2 行</text><text x="260" y="310" font-size="17" fill="#475569">例：[-0.5, 0.8]</text><path d="M260 330 V349" stroke="#475569" stroke-width="2"/><path d="M254 343 L260 350 L266 343" fill="none" stroke="#475569" stroke-width="2"/><rect x="35" y="355" width="450" height="72" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="260" y="384" font-size="21" fill="#172554">后续网络</text><text x="260" y="410" font-size="17" fill="#475569">结合上下文更新表示</text></g></svg>
